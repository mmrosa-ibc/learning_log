{% extends "learning_logs/base.html" %}

{% block header %}
    <h2>Tópicos:</h2>
{% endblock header %}

{% block content %}
    <ul>
        {% for topic in topics %}
            <li>
                <h3>
                    <a href="{% url 'topic' topic.id %}">{{ topic }}</a>
                </h3>
            </li>
        {% empty %}
            <li>Não há topicos adicionados</li>
        {% endfor %}
    </ul>

    <h3>
        <a href="{% url 'new_topic' %}">Adicionar novos tópicos</a>
    </h3>
{% endblock content %}
