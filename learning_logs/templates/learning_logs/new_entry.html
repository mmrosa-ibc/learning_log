{% extends "learning_logs/base.html" %}

{% load django_bootstrap5 %}

{% block header %}
    <h1><a href="{% url 'topic' topic.id %}">{{ topic }}</a></h1>
{% endblock header %}

{% block content %}

<p>Adicione uma nova entrada:</p>

<form action="{% url 'new_entry' topic.id %}" method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    <button name="submit" class="btn btn-primary">Adicionar</button>
</form>
{% endblock content %}
